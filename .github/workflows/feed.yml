name: Feed Jotaká

on:
  schedule:
    # A cada 15 min, das 9h às 20h45 (Brasília). O GitHub pode atrasar horários agendados;
    # o robô publica o que estiver na hora ou atrasado no dia, e nunca publica o mesmo post duas vezes.
    - cron: "*/15 12-23 * * *"
  # Teste sem publicar: enviar o arquivo testar-feed.txt
  push:
    branches: [main]
    paths: [testar-feed.txt, publicar-feed-agora.txt]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = testar o próximo post sem publicar | publish = publicar o de hoje"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]

permissions:
  contents: write

concurrency:
  group: feed-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar post do feed
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'publish' }}"
          DAY=""
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -q '^publicar-feed-agora.txt$'; then
            MODE=publish; PDAY="$(grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' publicar-feed-agora.txt | head -1)"
            python publish_feed.py --date "$PDAY"; exit $?
          fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE=dry-run; DAY="$(grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' testar-feed.txt | head -1)"; HORA="$(grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}' testar-feed.txt | head -1 | cut -c12-)"; fi
          if [ "$MODE" = "dry-run" ]; then
            if [ -n "$HORA" ]; then python publish_feed.py --dry-run --date "$DAY" --time "$HORA"; elif [ -n "$DAY" ]; then python publish_feed.py --dry-run --date "$DAY"; else python publish_feed.py --dry-run; fi
          else python publish_feed.py; fi
      - name: Registrar o que foi publicado
        if: always()
        run: |
          if [ -n "$(git status --porcelain published_feed.json 2>/dev/null)" ]; then
            git config user.name "stories-bot"
            git config user.email "stories-bot@users.noreply.github.com"
            git add published_feed.json
            git commit -m "Registro do feed $(TZ=America/Sao_Paulo date +%F)"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done
          fi
